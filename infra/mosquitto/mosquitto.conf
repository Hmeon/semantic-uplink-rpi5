# Minimal Mosquitto config for local dev / single-Pi stack.
# Safe default: bind to loopback so an anonymous broker is not exposed on LAN.
#
# If you need remote clients, change the listener host (e.g., 0.0.0.0) and
# configure authentication/TLS before exposing the broker.
listener 1883 127.0.0.1
allow_anonymous true

# Keep broker writes minimal; edge already persists via Outbox(SQLite).
persistence false
connection_messages false
log_type error
log_type warning
log_type notice
