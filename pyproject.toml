[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-uplink-rpi5"
version = "0.1.0"
description = "AIoT semantic uplink PoC on Raspberry Pi 5 (edge prediction + policy LinUCB + MQTT + tc + AoI/MAE/Rate)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Project Owner", email="owner@example.com"}]

dependencies = [
    "numpy>=1.24",
    "paho-mqtt>=1.6",
    "msgspec>=0.18",
    "sounddevice>=0.4",
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "pytest-cov>=5.0", "ruff>=0.4"]
analysis = ["matplotlib>=3.8"]
hw = ["smbus2>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "collector*", "edge*", "experiments*", "link*", "stack*"]
exclude = [
    "tests*",
    "docs*",
    "infra*",
    "models*",
    "scripts*",
    "data*",
    "logs*",
    "results*",
    "artifacts*",
    "node_modules*",
    ".github*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
include = [
    "common/**/*.py",
    "collector/**/*.py",
    "experiments/**/*.py",
    "link/**/*.py",
    "stack/**/*.py",
    "edge/policy/**/*.py",
    "tests/**/*.py",
]
extend-exclude = [
    "edge/edge_daemon.py",
    "edge/uploader/outbox.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = []
