# AIoT adaptive policy (relaxed safety for LinUCB exploration).
arms:
  - { tau: 1.0, kbits: 10 }
  - { tau: 2.0, kbits: 8 }
  - { tau: 3.0, kbits: 6 }
  - { tau: 5.0, kbits: 4 }
reward:
  alpha: 1.4
  beta: 1.0
  gamma: 0.7
safety:
  aoi_max_ms: 60000
  mae_max: 2.0
  safety_force_emit_on_aoi: false
diagnostics:
  enabled: true
scales:
  aoi_ms: 1000
  rate_bps: 256
sensors:
  temp:
    arms:
      - { tau: 0.1, kbits: 10 }
      - { tau: 0.2, kbits: 8 }
      - { tau: 0.4, kbits: 6 }
      - { tau: 0.6, kbits: 4 }
    reward:
      alpha: 1.6
      beta: 1.2
      gamma: 1.4
    safety:
      aoi_max_ms: 60000
      mae_max: 2.0
      safety_force_emit_on_aoi: false
    scales:
      aoi_ms: 1000
      rate_bps: 64
