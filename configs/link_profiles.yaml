# tc/netem 링크 프로파일 정의 (source of truth)
# - `link/shaper/tc_profiles.py`에서 이 YAML을 로딩해 사용할 수 있습니다(옵션).
# - 값은 IP 레벨 근사이며 LoRaWAN duty-cycle/ACK 등은 모델링하지 않습니다.
profiles:
  slow_10kbps:
    rate_kbit: 10
    delay_ms: 300
    jitter_ms: 50
    loss_pct: 3.0
    loss_corr_pct: 0.0
    reorder_pct: 0.0
  delay_loss:
    rate_kbit: 100
    delay_ms: 500
    jitter_ms: 100
    loss_pct: 8.0
    loss_corr_pct: 0.0
    reorder_pct: 10.0
  cellular_var:
    rate_kbit: null
    low_kbit: 50
    high_kbit: 200
    var_default_period_s: 30
    delay_ms: 120
    jitter_ms: 80
    loss_pct: 2.0
    loss_corr_pct: 0.0
    reorder_pct: 0.0
  lora_sf10:
    rate_kbit: 5
    delay_ms: 1200
    jitter_ms: 400
    loss_pct: 10.0
    loss_corr_pct: 40.0
    reorder_pct: 0.0
  lora_sf12:
    rate_kbit: 2
    delay_ms: 2000
    jitter_ms: 600
    loss_pct: 15.0
    loss_corr_pct: 50.0
    reorder_pct: 0.0
