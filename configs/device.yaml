# 디바이스/센서 설정
device_id: rpi5a
sensors:
  mic:
    frame_ms: 100
    samplerate: 16000
    normalize: true
  temp:
    period_hz: 1
ui:
  enabled: true
  backend: "lcd"   # lcd | console
buttons:
  enabled: true
mqtt:
  host: localhost
  port: 1883
  base_topic: "edge"
  # Optional auth/TLS (recommended if exposing broker beyond localhost)
  # username: "user"
  # password: "pass"
  # tls: false
  # cafile: "/etc/ssl/certs/ca-certificates.crt"
  # certfile: "/path/to/client.crt"
  # keyfile: "/path/to/client.key"
