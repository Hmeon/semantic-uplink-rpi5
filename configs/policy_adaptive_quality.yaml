# Quality-first adaptive policy (RTC-less runs, accuracy/freshness prioritized).
# - Smaller tau + higher kbits to reduce AoI/MAE.
# - Rate penalty kept minimal (gamma 낮음, rate_bps scale 큼).
# - Diagnostics on to enable full LinUCB plots/analysis.
arms:
  - { tau: 0.5, kbits: 12 }
  - { tau: 1.0, kbits: 12 }
  - { tau: 1.5, kbits: 10 }
  - { tau: 2.0, kbits: 8 }
reward:
  alpha: 2.0
  beta: 1.5
  gamma: 0.1
safety:
  aoi_max_ms: 2000
  mae_max: 2.0
  safety_force_emit_on_aoi: true
diagnostics:
  enabled: true
scales:
  aoi_ms: 500
  rate_bps: 1024
sensors:
  temp:
    arms:
      - { tau: 0.05, kbits: 12 }
      - { tau: 0.1, kbits: 12 }
      - { tau: 0.2, kbits: 10 }
      - { tau: 0.3, kbits: 10 }
    reward:
      alpha: 2.0
      beta: 1.5
      gamma: 0.1
    safety:
      aoi_max_ms: 2500
      mae_max: 2.0
      safety_force_emit_on_aoi: true
    scales:
      aoi_ms: 500
      rate_bps: 512
