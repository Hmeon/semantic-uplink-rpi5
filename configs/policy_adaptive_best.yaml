# Adaptive-tuned policy for slow_10kbps: sensor-specific arms + stronger rate penalty.
arms:
  - { tau: 1.5, kbits: 8 }
  - { tau: 3.0, kbits: 6 }
  - { tau: 6.0, kbits: 4 }
reward:
  alpha: 1.3
  beta: 1.0
  gamma: 0.6
safety:
  aoi_max_ms: 3000
  mae_max: 2.0
  safety_force_emit_on_aoi: true
scales:
  aoi_ms: 1000
  rate_bps: 256
sensors:
  temp:
    arms:
      - { tau: 0.2, kbits: 8 }
      - { tau: 0.5, kbits: 6 }
      - { tau: 1.0, kbits: 4 }
    reward:
      alpha: 1.2
      beta: 1.0
      gamma: 1.0
    safety:
      aoi_max_ms: 4000
      mae_max: 2.0
      safety_force_emit_on_aoi: true
    scales:
      aoi_ms: 1000
      rate_bps: 128
